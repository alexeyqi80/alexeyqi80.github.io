<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ПЭ2-26">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Расписание ПЭ2-26</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #22c55e;
      --orange: #f59e0b;
      --border: #334155;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: calc(70px + var(--safe-bottom));
      line-height: 1.35;
      overscroll-behavior: none;
    }
    header {
      background: linear-gradient(145deg, #1e3a8a 0%, #312e81 100%);
      padding: 14px 14px 12px;
      padding-top: max(14px, env(safe-area-inset-top));
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em; }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge.even { background: #22c55e; color: #052e16; }
    .badge.odd  { background: #f59e0b; color: #451a03; }
    .date-line { font-size: 0.8rem; color: #c7d2fe; margin-bottom: 10px; }
    .week-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .wbtn {
      border: none; border-radius: 11px; padding: 11px 8px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      background: rgba(255,255,255,0.12); color: #fff; transition: 0.15s;
    }
    .wbtn.active { background: #fff; color: #1e3a8a; }
    .wbtn:active { transform: scale(0.97); }
    main { padding: 14px; max-width: 560px; margin: 0 auto; }
    .day-head {
      font-size: 1.05rem; font-weight: 800; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .today-tag {
      font-size: 0.65rem; background: var(--accent); color: #fff;
      padding: 3px 8px; border-radius: 999px; font-weight: 700;
    }
    .pair {
      background: var(--card); border-radius: 14px; margin-bottom: 11px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .pair.now { border-color: var(--green); box-shadow: 0 0 0 1.5px var(--green); }
    .pair-top {
      display: flex; align-items: center; gap: 10px; padding: 11px 13px;
      background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border);
    }
    .num {
      width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
      color: #fff; display: grid; place-items: center; font-size: 0.8rem;
      font-weight: 800; flex-shrink: 0;
    }
    .pair.now .num { background: var(--green); }
    .time { font-weight: 700; font-size: 0.92rem; color: #93c5fd; }
    .pair-body { padding: 12px 13px 14px; }
    .type {
      display: inline-block; font-size: 0.68rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 7px;
      border-radius: 5px; margin-bottom: 4px;
    }
    .t-lk { background: #3b82f6; color: #fff; }
    .t-lb { background: #8b5cf6; color: #fff; }
    .t-u  { background: #14b8a6; color: #fff; }
    .t-el { background: #64748b; color: #fff; }
    .subj { font-weight: 700; font-size: 1.02rem; margin: 2px 0 4px; }
    .teacher { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
    .room {
      display: inline-flex; align-items: center; gap: 5px; font-size: 0.85rem;
      font-weight: 700; background: rgba(59,130,246,0.18); color: #93c5fd;
      padding: 5px 11px; border-radius: 8px;
    }
    .room::before { content: "📍"; font-size: 0.9rem; }
    .empty-day { text-align: center; padding: 36px 16px; color: var(--muted); }
    .empty-day .ico { font-size: 2.2rem; opacity: 0.4; margin-bottom: 8px; }
    .legend {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px;
      padding-top: 14px; border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--muted);
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 3px; }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b;
      border-top: 1px solid var(--border); display: flex;
      padding: 6px 2px calc(6px + var(--safe-bottom)); z-index: 50;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
    }
    .nav {
      flex: 1; background: none; border: none; color: var(--muted);
      font-size: 0.68rem; font-weight: 600; padding: 6px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }
    .nav.active { color: #60a5fa; }
    .nav .ico { font-size: 1.25rem; line-height: 1; }
    .install-hint {
      background: #1e3a8a; color: #e0e7ff; font-size: 0.78rem;
      padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
      display: none; align-items: center; gap: 10px;
    }
    .install-hint.show { display: flex; }
    .install-hint button {
      margin-left: auto; background: #fff; color: #1e3a8a; border: none;
      border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: 0.75rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>ПЭ2-26</h1>
      <div class="badge" id="badge">—</div>
    </div>
    <div class="date-line" id="dateLine">—</div>
    <div class="week-btns">
      <button class="wbtn" id="btnEven" onclick="forceWeek('numerator')">Чётная (числитель)</button>
      <button class="wbtn" id="btnOdd"  onclick="forceWeek('denominator')">Нечётная (знаменатель)</button>
    </div>
  </header>

  <main>
    <div class="install-hint" id="installHint">
      <span>Установить как приложение?</span>
      <button onclick="installApp()">Установить</button>
    </div>
    <div id="content"></div>
    <div class="legend">
      <span><span class="dot" style="background:#3b82f6"></span> лк — лекция</span>
      <span><span class="dot" style="background:#8b5cf6"></span> лб — лаб. работа</span>
      <span><span class="dot" style="background:#14b8a6"></span> у — практика</span>
      <span><span class="dot" style="background:#64748b"></span> электив</span>
    </div>
  </main>

  <footer id="footer"></footer>

  <script>
    const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница'];
    const SHORT = ['Пн','Вт','Ср','Чт','Пт'];

    const SCHEDULE = {
      0: [
        { time:'8:30 – 10:00', pair:1, both:{ type:'el', subject:'Элективные курсы по физической культуре и спорту', teacher:'', room:'' }},
        { time:'10:15 – 11:45', pair:2, both:{ type:'lk', subject:'Химия', teacher:'доц. Короткова Г.В.', room:'В 216' }},
        { time:'12:00 – 13:30', pair:3,
          numerator:  { type:'lb', subject:'Введение в электронику', teacher:'доц. Орехов В.А.', room:'Б 304' },
          denominator:{ type:'lk', subject:'Физика', teacher:'доц. Иванов В.Е.', room:'418' }
        }
      ],
      1: [
        { time:'10:15 – 11:45', pair:2, both:{ type:'lk', subject:'Информационные технологии', teacher:'доц. Образцов С.А.', room:'421' }},
        { time:'12:00 – 13:30', pair:3,
          numerator:  { type:'u',  subject:'Основы российской государственности', teacher:'ст.пр. Горяева М.Н.', room:'227' },
          denominator:{ type:'lb', subject:'Химия', teacher:'доц. Короткова Г.В., асс. Любенкова А.О.', room:'В 316 / В 318' }
        }
      ],
      2: [
        { time:'8:30 – 10:00', pair:1,
          numerator:  { type:'lk', subject:'Высшая математика', teacher:'проф. Мазалов М.Я.', room:'A 2' },
          denominator:{ type:'u',  subject:'Химия', teacher:'асс. Любенкова А.О.', room:'503' }
        },
        { time:'10:15 – 11:45', pair:2,
          numerator:  { type:'u',  subject:'Физика', teacher:'доц. Иванов В.Е.', room:'520' },
          denominator:{ type:'lb', subject:'Физика', teacher:'доц. Иванов В.Е.', room:'A 214 / A 217' }
        },
        { time:'12:00 – 13:30', pair:3, both:{ type:'el', subject:'Элективные курсы по физической культуре и спорту', teacher:'', room:'' }}
      ],
      3: [
        { time:'10:15 – 11:45', pair:2,
          numerator: { type:'lb', subject:'Информационные технологии', teacher:'асс. Гондоров Д.А.', room:'A 317' }
        },
        { time:'12:00 – 13:30', pair:3, both:{ type:'u', subject:'Высшая математика', teacher:'проф. Мазалов М.Я.', room:'404' }},
        { time:'14:00 – 15:30', pair:4,
          denominator: { type:'u', subject:'Основы российской государственности', teacher:'ст.пр. Горяева М.Н.', room:'227' }
        }
      ],
      4: [
        { time:'8:30 – 10:00', pair:1,
          numerator: { type:'u', subject:'Информационные технологии', teacher:'асс. Гондоров Д.А.', room:'520' }
        },
        { time:'10:15 – 11:45', pair:2,
          numerator:  { type:'lk', subject:'Основы российской государственности', teacher:'ст.пр. Горяева М.Н.', room:'A 1' },
          denominator:{ type:'lk', subject:'Высшая математика', teacher:'проф. Мазалов М.Я.', room:'A 2' }
        },
        { time:'12:00 – 13:30', pair:3,
          denominator: { type:'u', subject:'Иностранный язык', teacher:'доц. Макерова Н.В.', room:'404' }
        },
        { time:'14:00 – 15:30', pair:4,
          denominator: { type:'u', subject:'Физика', teacher:'доц. Иванов В.Е.', room:'520' }
        }
      ]
    };

    let dayIdx = (() => {
      const d = new Date().getDay();
      if (d === 0 || d === 6) return 0;
      return d - 1;
    })();
    let forcedWeek = null;

    function getISOWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function autoWeekType() {
      // 1 сентября 2026 = ISO 36 = чётная → числитель
      return (getISOWeek(new Date()) % 2 === 0) ? 'numerator' : 'denominator';
    }

    function currentWeekType() {
      return forcedWeek || autoWeekType();
    }

    function getLesson(slot) {
      if (slot.both) return slot.both;
      const w = currentWeekType();
      return (w === 'numerator' ? slot.numerator : slot.denominator) || null;
    }

    function typeLabel(t) { return { lk:'лк', lb:'лб', u:'у', el:'электив' }[t] || t; }
    function typeCls(t) { return 't-' + t; }

    function isNow(timeStr) {
      const today = (new Date().getDay() + 6) % 7;
      if (today !== dayIdx || today > 4) return false;
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      const [a, b] = timeStr.split('–').map(s => s.trim());
      const toM = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
      return mins >= toM(a) - 8 && mins <= toM(b) + 5;
    }

    function render() {
      const w = currentWeekType();
      const isEven = w === 'numerator';

      const badge = document.getElementById('badge');
      badge.textContent = isEven ? 'Чётная · числитель' : 'Нечётная · знаменатель';
      badge.className = 'badge ' + (isEven ? 'even' : 'odd');

      const now = new Date();
      const opts = { weekday:'long', day:'numeric', month:'long' };
      const mode = forcedWeek ? 'ручной' : 'авто';
      document.getElementById('dateLine').textContent =
        now.toLocaleDateString('ru-RU', opts) + ' · ' + mode + ' · нед. ' + getISOWeek(now);

      document.getElementById('btnEven').classList.toggle('active', isEven);
      document.getElementById('btnOdd').classList.toggle('active', !isEven);

      const slots = SCHEDULE[dayIdx] || [];
      let html = `<div class="day-head">${DAYS[dayIdx]}`;
      const realToday = (new Date().getDay() + 6) % 7;
      if (realToday === dayIdx && realToday < 5) html += `<span class="today-tag">сегодня</span>`;
      html += `</div>`;

      let hasAny = false;
      slots.forEach(slot => {
        const les = getLesson(slot);
        if (!les) return;
        hasAny = true;
        const nowCls = isNow(slot.time) ? 'now' : '';
        html += `
          <div class="pair ${nowCls}">
            <div class="pair-top">
              <div class="num">${slot.pair}</div>
              <div class="time">${slot.time}</div>
            </div>
            <div class="pair-body">
              <span class="type ${typeCls(les.type)}">${typeLabel(les.type)}</span>
              <div class="subj">${les.subject}</div>
              ${les.teacher ? `<div class="teacher">${les.teacher}</div>` : ''}
              ${les.room ? `<div class="room">${les.room}</div>` : ''}
            </div>
          </div>`;
      });

      if (!hasAny) html += `<div class="empty-day"><div class="ico">📭</div>Пар нет</div>`;
      document.getElementById('content').innerHTML = html;

      let nav = '';
      SHORT.forEach((s, i) => {
        nav += `<button class="nav ${i===dayIdx?'active':''}" onclick="setDay(${i})">
          <span class="ico">${['1','2','3','4','5'][i]}</span>${s}
        </button>`;
      });
      document.getElementById('footer').innerHTML = nav;
    }

    function setDay(i) {
      dayIdx = i;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function forceWeek(type) {
      if (forcedWeek === type) forcedWeek = null;
      else forcedWeek = type;
      render();
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installHint').classList.add('show');
    });

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installHint').classList.remove('show');
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    render();
    setInterval(render, 60000);
  </script>
</body>
</html>
